<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Tableau de bord</h1>
  </div>

  <!-- Stat Cards using reusable component -->
  <div class="stat-cards-grid">
    <!-- Total des pays -->
    <app-stat-card 
      title="Total des pays" 
      [value]="totalPays()"
      iconColor="violet">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" icon>
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
      </svg>
      <div class="stat-footer">
        <span class="stat-change stat-change--up">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14l5-5 5 5z"/>
          </svg>
          8.5% Up from yesterday
        </span>
      </div>
    </app-stat-card>

    <!-- Entrepôts actifs -->
    <app-stat-card 
      title="Entrepôts actifs" 
      [value]="totalEntrepots()"
      iconColor="orange">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" icon>
        <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
      </svg>
      <div class="stat-footer">
        <span class="stat-change stat-change--up">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14l5-5 5 5z"/>
          </svg>
          1.3% Up from past week
        </span>
      </div>
    </app-stat-card>

    <!-- Nombre total de lots -->
    <app-stat-card 
      title="Nombre total de lots" 
      [value]="totalLots()"
      iconColor="green">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" icon>
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      <div class="stat-footer">
        <span class="stat-change stat-change--down">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
          4.3% Down from yesterday
        </span>
      </div>
    </app-stat-card>

    <!-- Alertes critiques -->
    <app-stat-card 
      title="Alertes critiques" 
      [value]="alertesCritiques()"
      iconColor="pink">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" icon>
        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
      </svg>
      <div class="stat-footer">
        <span class="stat-change stat-change--up">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14l5-5 5 5z"/>
          </svg>
          1.8% Up from yesterday
        </span>
      </div>
    </app-stat-card>
  </div>

  <!-- Sales Details Section -->
  <div class="sales-section">
    <div class="sales-header">
      <h2>Sales Details</h2>
      <select class="month-select">
        <option>October</option>
        <option>November</option>
        <option>December</option>
      </select>
    </div>
    <div class="sales-chart-placeholder">
      <p>Graphique des ventes</p>
    </div>
  </div>
</div>
