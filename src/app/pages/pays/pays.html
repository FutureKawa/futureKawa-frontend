<div class="m-5">
  <span class="text-2xl font-bold"> Tableau de bord {{ countryName() }} </span>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-4">
    @for (stat of stats(); track stat.title) {
      <app-stat-card title="{{ stat.title }}" [value]="stat.value" iconColor="violet">
        <img icon [src]="stat.icon" alt="icon" class="w-10 h-10" />
        <div class="mt-4 flex items-center gap-2 text-sm text-[#12163C]">
          <img
            [src]="stat.trend === 'up' ? '/images/gotop.svg' : '/images/godown.svg'"
            alt=""
            class="w-4 h-4"
          />
          <span
            class="font-semibold"
            [class.text-[#00B69B]]="stat.trend === 'up'"
            [class.text-red-500]="stat.trend === 'down'"
          >
            {{ stat.percent }}
          </span>
          <span>
            {{ stat.trend === 'up' ? 'Up from yesterday' : 'Down from yesterday' }}
          </span>
        </div>
      </app-stat-card>
    }
  </div>

  <div>
      <app-pays-chart [countryCode]="selectedCountry()?.code ?? null"></app-pays-chart>
  </div>
</div>
