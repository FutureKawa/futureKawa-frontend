<div class="stat-card">
  <div class="stat-top">
    <span class="stat-label">{{ title }}</span>
    <div class="stat-icon stat-icon--{{ iconColor }}">
      <ng-content select="[icon]"></ng-content>
    </div>
  </div>
  <p class="stat-value">{{ value }}</p>
  <div class="stat-footer">
    <ng-content></ng-content>
  </div>
</div>
