<div class="stat-card">
  <div class="stat-top">
    <span class="stat-label">{{ stat().title }}</span>

    <div class="stat-icon stat-icon--{{ stat().color }}">
      <img [src]="stat().imagePath" [alt]="stat().title" class="stat-image" />
    </div>
  </div>
  <p class="stat-value">{{ stat().value }}</p>

  <p class="stat-footer">
    {{ stat().text }}
  </p>
</div>
